<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
</head>
<body style="
      background-color: #272727;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    ">
    <!-- Original email content with SVG logo -->
    <div style="
        background-color: #212121;
        color: white;
        padding: 20px;
        text-align: center;
        font-size: 24px;
      ">
        <img src="https://res.cloudinary.com/ddocl1wnp/image/upload/v1752937262/Layer_1_ubnzii.png"
             width="256"
             height="50"
             alt="CarsAndBids Logo" />
    </div>
    <div style="
        display: flex;
        justify-content: center;
        align-items: center;

        background-color: #272727;
        color: white;
        font-family: Arial, sans-serif;
      ">
        <!-- Added modal card inspired by the image with SVG logo -->
        <div style="
          background-color: #212121;
          display: inline-block;
          margin: 20px auto;
          padding: 20px;
          border: 2px solid #ec2729;
          border-radius: 10px;
          color: #ffffff;
        ">
            <div style="text-align: center; margin-bottom: 20px">
                <!-- SVG logo -->

                <img src="https://res.cloudinary.com/ddocl1wnp/image/upload/v1753006376/Logo_Icon_1_xqxtby.png"
                     width="58"
                     height="39"
                     alt="CarsAndBids Logo" />
            </div>
            <p style="font-size: 24px">Dear User,</p>
            <p style="font-size: 16px">
                We received a request to reset your password. Click the button below
                to reset it:
            </p>
            <div style="text-align: center">
                <a href="http://localhost:7162/reset-password?token={{ResetToken}}&email={{Email}}"
                   style="
              background-color: #ec2729;
              color: #ffffff;
              padding: 10px 20px;
              text-decoration: none;
              border-radius: 5px;
              display: inline-block;
              border: 2px solid #ec2729;
            "
                   onmouseover="this.style.backgroundColor='transparent'; this.style.border='2px solid #EC2729'; this.style.color='#EC2729';"
                   onmouseout="this.style.backgroundColor='#EC2729'; this.style.border='2px solid #EC2729'; this.style.color='#ffffff';">Reset Password</a>
            </div>
            <p style="font-size: 16px; margin-top: 20px">
                If you did not request this, please ignore this email.
            </p>
            <p style="font-size: 16px">The token is valid for 24 hours.</p>

        </div>

    </div>
    <div style="
  text-align: center;
  font-size: 12px;
  color: #969696;
  margin-top: 20px;
">
        © 2025 CarsAndBids. All rights reserved.
    </div>
</body>
</html>
