
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        body {
            background-color: rgb(39, 39, 39);
            color: rgb(33, 33, 33);
            font-family: Arial, sans-serif;
        }

        .header {
            background-color: rgb(33, 33, 33);
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 24px;
        }

        .container {
            background-color: rgb(44, 44, 44);
            max-width: 600px;
            margin: 20px auto;
            padding: 20px;
            border-radius: 10px;
            color: rgb(255, 255, 255);
        }

        .button {
            background-color: rgb(236, 39, 41);
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 5px;
            display: inline-block;
            margin-top: 20px;
            margin-bottom: 20px;
        }

        .footer {
            text-align: center;
            font-size: 12px;
            color: rgb(150, 150, 150);
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="header" style="text-align: center; background-color: rgb(33, 33, 33); color: white; padding: 20px; font-size: 24px">
        <img height="50" view-box="0 0 256 50" width="256" alt="Logo" src="https://res.cloudinary.com/carsbids/image/upload/v1752870219/images/954b3df2-0a2b-4ff0-bf61-467419e76ad9.webp" style="display: block; margin: 0 auto">
    </div>
    <div esd-text="true" class="container esd-text">
        <p>
            Dear User,
        </p>
        <p>
            We received a request to reset your password. Click the button below to reset it:
        </p>
        <div style="text-align:center">
            <a href="http://localhost:7162/reset-password?token={{ResetToken}}" class="button">
                Reset Password
            </a>
        </div>
        <p>
            If you did not request this, please ignore this email.
        </p>
        <p>
            The token is valid for 24 hours.
        </p>
    </div>
    <div esd-text="true" class="footer esd-text">
        © 2025 CarsAndBids. All rights reserved.
    </div>
</body>
</html>
